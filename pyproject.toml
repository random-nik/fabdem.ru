[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fabdem-downloader"
version = "0.1.0"
description = "Local web app for downloading FABDEM tiles and clipped GeoTIFFs"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "rasterio>=1.3",
    "shapely>=2.0",
    "pyproj>=3.6",
    "httpx>=0.27",
    "fastkml>=1.0",
    "remotezip>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = [
    "templates/*.html",
    "static/*",
    "static/vendor/*",
    "static/vendor/images/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests that use the real FABDEM source over the network",
]
